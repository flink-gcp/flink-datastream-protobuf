name: Docs

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read

jobs:
  plan:
    name: Select documentation versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      controller_sha: ${{ steps.plan.outputs.controller_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: python uv
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: just docs-site plan "$RUNNER_TEMP/docs-plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-plan
          path: ${{ runner.temp }}/docs-plan.json

  build:
    name: Build documentation (${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: controller
    env:
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.controller_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-plan
          path: ${{ runner.temp }}
      # Use each source tree's toolchain; the controller only assembles metadata.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: source
          install_args: hugo-extended go java python uv node
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      # The controller runs docs-site.py on its own pinned Python, which a
      # milestone tag's toolchain above need not provide.
      - name: Install the controller's Python
        run: mise install python
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-${{ hashFiles('source/mise.toml') }}-${{ hashFiles('source/docs/go.sum') }}
          restore-keys: hugo-${{ hashFiles('source/mise.toml') }}-
      # The controller's action serves every source line, which may predate it. The standalone
      # examples install into a disposable external Maven repository.
      - uses: ./controller/.github/actions/maven
      - name: Test documentation version rendering
        if: matrix.id == 'development'
        run: just test-doc-versions
      - name: Build and validate the selected source
        env:
          DOCS_VERSION: ${{ matrix.id }}
        run: just docs-site build "$RUNNER_TEMP/docs-plan.json" "$DOCS_VERSION" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/line"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-line-${{ matrix.id }}
          path: ${{ runner.temp }}/line

  assemble:
    name: Assemble documentation site
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.controller_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-plan
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docs-line-*
          merge-multiple: true
          path: ${{ runner.temp }}/lines
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: python uv
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: Assemble every planned version
        run: just docs-site assemble "$RUNNER_TEMP/docs-plan.json" "$RUNNER_TEMP/lines" "$RUNNER_TEMP/site"
      - name: Check assembled pages, assets and anchors
        run: just docs-site check "$RUNNER_TEMP/docs-plan.json" "$RUNNER_TEMP/site"
      # PRs package the same combined artifact as publication, including all
      # retained releases, navigation, redirects and the generated API reference.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  docs_passed:
    name: Docs passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, build, assemble]
    if: ${{ always() }}
    steps:
      - name: Require every documentation job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | jq -e 'all(.[]; .result == "success")'
