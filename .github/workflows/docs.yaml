name: Docs

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read

jobs:
  plan:
    name: Select documentation versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      controller_sha: ${{ steps.plan.outputs.controller_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/docs-site.py plan "$RUNNER_TEMP/docs-plan.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-plan
          path: ${{ runner.temp }}/docs-plan.json

  build:
    name: Build documentation (${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: controller
    env:
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.controller_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-plan
          path: ${{ runner.temp }}
      # Use each source tree's toolchain; the controller only assembles metadata.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: source
          install_args: hugo-extended go java uv node
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: just
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-${{ hashFiles('source/mise.toml') }}-${{ hashFiles('source/docs/go.sum') }}
          restore-keys: hugo-${{ hashFiles('source/mise.toml') }}-
      # The standalone examples install into a disposable external Maven repository.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-docs-${{ hashFiles('source/**/pom.xml') }}
          restore-keys: maven-docs-
      - name: Test documentation version rendering
        if: matrix.id == 'development'
        run: just test-doc-versions
      - name: Build and validate the selected source
        env:
          DOCS_VERSION: ${{ matrix.id }}
        run: just docs-site build "$RUNNER_TEMP/docs-plan.json" "$DOCS_VERSION" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/line"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-line-${{ matrix.id }}
          path: ${{ runner.temp }}/line

  assemble:
    name: Assemble documentation site
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.controller_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-plan
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docs-line-*
          merge-multiple: true
          path: ${{ runner.temp }}/lines
      - name: Assemble every planned version
        run: python3 scripts/docs-site.py assemble "$RUNNER_TEMP/docs-plan.json" "$RUNNER_TEMP/lines" "$RUNNER_TEMP/site"
      - name: Check assembled pages, assets and anchors
        run: python3 scripts/docs-site.py check "$RUNNER_TEMP/docs-plan.json" "$RUNNER_TEMP/site"
      # PRs package the same combined artifact as publication, including all
      # retained releases, navigation, redirects and the generated API reference.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  docs_passed:
    name: Docs passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, build, assemble]
    if: ${{ always() }}
    steps:
      - name: Require every documentation job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | jq -e 'all(.[]; .result == "success")'
