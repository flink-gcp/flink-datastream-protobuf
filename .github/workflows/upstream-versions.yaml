name: Upstream versions
# Dependabot misses Flink minors and profile pins; see "Upstream release check" in docs/development.md.
# This workflow stays outside CI, so a new upstream release never fails a pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'
permissions:
  contents: read
jobs:
  check:
    name: Compare Flink and Protobuf pins with Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python uv
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      - name: Name the pins that newer upstream releases overtake
        run: just upstream-versions
