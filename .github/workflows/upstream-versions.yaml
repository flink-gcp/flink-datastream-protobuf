name: Upstream versions
# Dependabot misses Flink minors and profile pins; see "Upstream release check" in docs/development.md.
# This workflow stays outside CI, so a new upstream release never fails a pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'
permissions:
  contents: read
jobs:
  check:
    name: Compare Flink and Protobuf pins with Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: python uv
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just
      - name: Name the pins that newer upstream releases overtake
        run: just upstream-versions
