name: Upstream versions
# Dependabot misses Flink minors and profile pins; see "Upstream release check" in docs/development.md.
# This workflow stays outside CI, so a new upstream release never fails a pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'
permissions:
  contents: read
jobs:
  check:
    name: Compare Flink and Protobuf pins with Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python uv
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just
      - name: Name the pins that newer upstream releases overtake
        run: just upstream-versions
