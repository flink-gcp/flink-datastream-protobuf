name: Lint
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: actionlint shellcheck node npm:markdownlint-cli2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just
      - name: Lint workflows and documentation
        run: just lint
      - name: Test the evidence content gate with synthetic inputs
        run: just benchmark-evidence-test
      - name: Inspect retained benchmark evidence
        run: just benchmark-evidence-repository "$RUNNER_TEMP/evidence-inventories"
      - name: Retain inspection inventories without the existing evidence archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retained-benchmark-evidence-inventories
          path: ${{ runner.temp }}/evidence-inventories
          if-no-files-found: error
