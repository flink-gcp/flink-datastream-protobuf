name: Lint
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: actionlint shellcheck node npm:markdownlint-cli2 python uv
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just
      - name: Lint workflows and documentation
        run: just lint
      - name: Test the Python tools offline with synthetic inputs
        run: just test-scripts
      - name: Inspect retained benchmark evidence
        run: just benchmark-evidence-repository "$RUNNER_TEMP/evidence-inventories"
      - name: Retain inspection inventories without the existing evidence archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retained-benchmark-evidence-inventories
          path: ${{ runner.temp }}/evidence-inventories
          if-no-files-found: error
