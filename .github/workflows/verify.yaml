name: Verify
on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
env:
  FLINK_CEILING: '2.3.0'
jobs:
  build:
    name: ${{ matrix.runtime }} / JDK ${{ matrix.java }} / Protobuf ${{ matrix.protobuf }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [floor, ceiling, lts]
        java: ['17', '21']
        protobuf: ['3', '4']
        exclude:
          - runtime: lts
            java: '21'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just
      - name: Verify the library and native probes
        env:
          RUNTIME: ${{ matrix.runtime }}
          PROTOBUF: ${{ matrix.protobuf }}
        run: |
          case "$RUNTIME" in
            floor) just verify-protobuf "$PROTOBUF" ;;
            ceiling) just verify-flink "$FLINK_CEILING" "$PROTOBUF" ;;
            lts) just verify-protobuf "$PROTOBUF" -Dflink.compat=flink1 ;;
            *) exit 1 ;;
          esac
      - name: Prepare the opt-in benchmark compiler
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y bison flex cmake
          just benchmark-tools "$RUNNER_TEMP/benchmark-tools"
      - name: Validate serializer selection and smoke the benchmark harness
        env:
          RUNTIME: ${{ matrix.runtime }}
          PROTOBUF: ${{ matrix.protobuf }}
          BENCHMARK_THRIFT_COMPILER: ${{ runner.temp }}/benchmark-tools/build/compiler/cpp/bin/thrift
        run: |
          case "$RUNTIME" in
            floor) version=2.2.1 ;;
            ceiling) version="$FLINK_CEILING" ;;
            lts) version=1.20.4 ;;
            *) exit 1 ;;
          esac
          just benchmark-smoke "$version" "$PROTOBUF" "$RUNNER_TEMP/benchmark-smoke"
      - name: Retain benchmark smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ matrix.runtime }}-jdk${{ matrix.java }}-protobuf${{ matrix.protobuf }}
          path: ${{ runner.temp }}/benchmark-smoke
          if-no-files-found: warn
  binary-compat:
    name: Unchanged 2.x jar / Protobuf ${{ matrix.protobuf }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        protobuf: ['3', '4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just
      - name: Run the floor jar on the ceiling runtime without recompilation
        env:
          PROTOBUF: ${{ matrix.protobuf }}
        run: just binary-compat "$FLINK_CEILING" "$PROTOBUF"
