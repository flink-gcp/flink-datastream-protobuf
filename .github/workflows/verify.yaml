name: Verify
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      # CI's source job selects these for pull requests; every other event runs both.
      benchmarks:
        type: boolean
        default: true
      baseline:
        type: boolean
        default: true
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
env:
  FLINK_CEILING: '2.3.0'
# Job and smoke limits follow docs/validation/ci-budget.md.
jobs:
  build:
    name: ${{ matrix.runtime }} / JDK ${{ matrix.java }} / Protobuf ${{ matrix.protobuf }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [floor, ceiling, lts]
        java: ['17', '21']
        protobuf: ['3', '4']
        exclude:
          - runtime: lts
            java: '21'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Install Python and uv for the Python tools before setup-java selects the matrix JDK.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: python uv
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Only this job saves the shared Maven entry; see "CI Maven resolution" in docs/development.md.
      - uses: ./.github/actions/maven
        with:
          save: ${{ github.ref == 'refs/heads/main' && matrix.runtime == 'floor' && matrix.java == '17' && matrix.protobuf == '4' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: Verify the library and native probes
        env:
          RUNTIME: ${{ matrix.runtime }}
          PROTOBUF: ${{ matrix.protobuf }}
        run: |
          case "$RUNTIME" in
            floor) just verify-protobuf "$PROTOBUF" ;;
            ceiling) just verify-flink "$FLINK_CEILING" "$PROTOBUF" ;;
            lts) just verify-protobuf "$PROTOBUF" -Dflink.compat=flink1 ;;
            *) exit 1 ;;
          esac
      - name: Verify the standalone application examples
        env:
          RUNTIME: ${{ matrix.runtime }}
          PROTOBUF: ${{ matrix.protobuf }}
        run: |
          case "$RUNTIME" in
            floor) version=2.2.1 ;;
            ceiling) version="$FLINK_CEILING" ;;
            lts) version=1.20.4 ;;
            *) exit 1 ;;
          esac
          just examples-verify "$version" "$PROTOBUF" "$RUNNER_TEMP/example-maven-repository"
      - name: Check public API Javadoc
        env:
          RUNTIME: ${{ matrix.runtime }}
          PROTOBUF: ${{ matrix.protobuf }}
        run: |
          if [[ "$RUNTIME" == lts ]]; then compat=flink1; else compat=flink2; fi
          just docs-javadoc "$compat" "$PROTOBUF"
      # See "CI compiler reuse and job budgets" in docs/development.md.
      - name: Identify the reusable benchmark compiler
        id: compiler-identity
        if: github.event_name != 'pull_request' || inputs.benchmarks
        run: |
          identity=$(just benchmark-tools-identity)
          echo "key=benchmark-compiler-$identity" >> "$GITHUB_OUTPUT"
      - name: Restore the benchmark compiler
        id: compiler-cache
        if: github.event_name != 'pull_request' || inputs.benchmarks
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/benchmark-tools/build/compiler/cpp/bin/thrift
          key: ${{ steps.compiler-identity.outputs.key }}
      - name: Prepare the opt-in benchmark compiler
        id: compiler
        if: github.event_name != 'pull_request' || inputs.benchmarks
        env:
          RESTORED: ${{ steps.compiler-cache.outputs.cache-hit }}
          COMPILER: ${{ runner.temp }}/benchmark-tools/build/compiler/cpp/bin/thrift
        run: |
          if [[ "$RESTORED" == true ]]; then
            if just benchmark-tools-check "$COMPILER"; then
              exit 0
            fi
            echo '::warning::The restored benchmark compiler failed validation; building the pinned source instead.'
            rm -f "$COMPILER"
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y bison flex cmake
          just benchmark-tools "$RUNNER_TEMP/benchmark-tools"
          echo 'built=true' >> "$GITHUB_OUTPUT"
      - name: Save the validated benchmark compiler
        if: ${{ steps.compiler.outputs.built == 'true' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/benchmark-tools/build/compiler/cpp/bin/thrift
          key: ${{ steps.compiler-identity.outputs.key }}
      - name: Validate serializer selection and smoke the benchmark harness
        id: benchmark-smoke
        if: github.event_name != 'pull_request' || inputs.benchmarks
        env:
          RUNTIME: ${{ matrix.runtime }}
          PROTOBUF: ${{ matrix.protobuf }}
          BENCHMARK_THRIFT_COMPILER: ${{ runner.temp }}/benchmark-tools/build/compiler/cpp/bin/thrift
        run: |
          case "$RUNTIME" in
            floor) version=2.2.1 ;;
            ceiling) version="$FLINK_CEILING" ;;
            lts) version=1.20.4 ;;
            *) exit 1 ;;
          esac
          status=0
          timeout --kill-after=30s 5m just benchmark-smoke "$version" "$PROTOBUF" "$RUNNER_TEMP/benchmark-smoke" &
          smoke=$!
          wait "$smoke" || status=$?
          # timeout leads its own process group; stop descendants that outlived it before the evidence gate reads the output.
          kill -KILL -- "-$smoke" 2>/dev/null || true
          if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
            echo '::error::The benchmark smoke reached its five-minute command limit or was killed.'
          fi
          exit "$status"
      - name: Validate benchmark evidence before upload
        id: evidence-gate
        if: ${{ !cancelled() && steps.benchmark-smoke.outcome != 'skipped' }}
        run: |
          if [[ -d "$RUNNER_TEMP/benchmark-smoke" ]]; then
            just benchmark-evidence-check "$RUNNER_TEMP/benchmark-smoke" "$RUNNER_TEMP/checked-benchmark-evidence"
            echo 'validated=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain checked benchmark smoke evidence
        if: ${{ !cancelled() && steps.evidence-gate.outcome == 'success' && steps.evidence-gate.outputs.validated == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.runtime }}-jdk${{ matrix.java }}-protobuf${{ matrix.protobuf }}
          path: ${{ runner.temp }}/checked-benchmark-evidence
          if-no-files-found: error
  binary-compat:
    name: Unchanged ${{ matrix.line }} jar / Protobuf 4 and 3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        line: [flink2, flink1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: python uv
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/maven
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: Run the Protobuf 4 jar on the 2.x ceiling and Protobuf 3 without recompiling it
        env:
          LINE: ${{ matrix.line }}
        run: |
          if [[ "$LINE" == flink2 ]]; then
            just binary-compat flink2 "$FLINK_CEILING"
          else
            just binary-compat flink1
          fi
  release-rehearsal:
    name: Central bundles / both lines / unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: python uv
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/maven
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      # Pull requests have no signing key, so this rehearsal skips signing (ADR-0006).
      - name: Stage and inspect both lines without uploading them
        run: |
          version=$(./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          just release-rehearse "${version%-SNAPSHOT}" "$RUNNER_TEMP/release-rehearsal" --unsigned
  development-baseline:
    name: Development bundle / ${{ matrix.line }} / Protobuf ${{ matrix.protobuf }}
    if: github.event_name != 'pull_request' || inputs.baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        line: [flink2, flink1]
        protobuf: ['3', '4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/maven
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just
      - name: Capture the development bundle once
        env:
          LINE: ${{ matrix.line }}
          PROTOBUF: ${{ matrix.protobuf }}
        run: |
          just baseline-capture "$LINE" "$PROTOBUF" "$RUNNER_TEMP/baseline"
          mv target "$RUNNER_TEMP/baseline-build"
          just baseline-check "$RUNNER_TEMP/baseline"
      - name: Read retained inputs on JDK 17 without build outputs
        env:
          LINE: ${{ matrix.line }}
        run: |
          if [[ "$LINE" == flink2 ]]; then versions='2.2.1 2.3.0'; else versions='1.20.4'; fi
          for version in $versions; do
            just baseline-read "$RUNNER_TEMP/baseline" "$version" "$RUNNER_TEMP/read-17-$version"
          done
      # Keeps the forward-restore check working on the bundle that this build wrote until a published
      # release is retained; see "Restore retained state with the current library" in
      # docs/validation/development-baselines.md.
      - name: Restore the bundle's state with the current library on JDK 17
        env:
          LINE: ${{ matrix.line }}
        run: |
          if [[ "$LINE" == flink2 ]]; then versions='2.2.1 2.3.0'; else versions='1.20.4'; fi
          for version in $versions; do
            just baseline-upgrade "$RUNNER_TEMP/baseline" "$version"
          done
      # The same build wrote the bundle, so these keep the API gate and the compiled consumers
      # working rather than compare releases; see "API compatibility gate" in docs/development.md.
      - name: Compare the annotated API with the bundle's library
        run: |
          just api-compat "$RUNNER_TEMP/baseline"
          cp target/flink-datastream-protobuf-*-SNAPSHOT.jar "$RUNNER_TEMP/candidate.jar"
      - name: Run the bundle's compiled consumers on the candidate with JDK 17
        env:
          LINE: ${{ matrix.line }}
        run: |
          if [[ "$LINE" == flink2 ]]; then versions='2.2.1 2.3.0'; else versions='1.20.4'; fi
          for version in $versions; do
            just baseline-consume "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/candidate.jar" "$version" "$RUNNER_TEMP/consume-17-$version"
          done
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.line == 'flink2'
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the same retained inputs on JDK 21
        if: matrix.line == 'flink2'
        run: |
          for version in 2.2.1 2.3.0; do
            just baseline-read "$RUNNER_TEMP/baseline" "$version" "$RUNNER_TEMP/read-21-$version"
          done
      - name: Show failed development capture, reader, or consumer logs
        if: failure()
        run: |
          for directory in "$RUNNER_TEMP/baseline" "$RUNNER_TEMP"/read-* "$RUNNER_TEMP"/consume-*; do
            if [[ -d "$directory" ]]; then
              find "$directory" -name '*.log' -type f -exec tail -n 60 {} +
            fi
          done
