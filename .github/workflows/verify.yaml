name: Verify
on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
env:
  FLINK_CEILING: '2.3.0'
jobs:
  build:
    name: ${{ matrix.runtime }} / JDK ${{ matrix.java }} / Protobuf ${{ matrix.protobuf }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [floor, ceiling, lts]
        java: ['17', '21']
        protobuf: ['3', '4']
        exclude:
          - runtime: lts
            java: '21'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just
      - name: Verify the library and native probes
        env:
          RUNTIME: ${{ matrix.runtime }}
          PROTOBUF: ${{ matrix.protobuf }}
        run: |
          case "$RUNTIME" in
            floor) just verify-protobuf "$PROTOBUF" ;;
            ceiling) just verify-flink "$FLINK_CEILING" "$PROTOBUF" ;;
            lts) just verify-protobuf "$PROTOBUF" -Dflink.compat=flink1 ;;
            *) exit 1 ;;
          esac
  binary-compat:
    name: Unchanged 2.x jar / Protobuf ${{ matrix.protobuf }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        protobuf: ['3', '4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just
      - name: Run the floor jar on the ceiling runtime without recompilation
        env:
          PROTOBUF: ${{ matrix.protobuf }}
        run: just binary-compat "$FLINK_CEILING" "$PROTOBUF"
