baseURL = "https://flink-gcp.github.io/flink-datastream-protobuf/"
locale = "en-us"
title = "Protobuf for Apache Flink DataStream"

[markup]
  # Emit CSS classes instead of inlining one fixed colour scheme into every code
  # block; the shared module selects the light/dark palettes so code
  # follows the page theme.
  [markup.highlight]
    noClasses = false

# The shared design module and its Hugo Book dependency are pinned through go.mod.
[module]
  # Sub-target mounts replace the default assets mount for this component.
  [[module.mounts]]
    source = "../examples/datastream/src/main/java/io/github/flink/gcp/protobuf/examples"
    target = "assets/examples/java"
    files = ["/*.java"]
  [[module.mounts]]
    source = "../examples/datastream/config"
    target = "assets/examples/config"
    files = ["/config.yaml"]
  [[module.mounts]]
    source = "../src/test/runtime-app/proto"
    target = "assets/runtime-schemas"
    files = ["/*/runtime.proto"]

  # The design module comes first so its layouts and assets override the theme's.
  # ignoreImports drops all of its imports (today only Hugo Book), which the
  # import below replaces so that the site publishes only the theme files it
  # uses. Hugo Book's KaTeX, Mermaid and asciinema-player features are left out:
  # their bundles carry no notice of their own, KaTeX's fonts are under the SIL
  # OFL, and the Mermaid and asciinema-player bundles compile in third-party
  # dependencies.
  # With their shortcodes and code-block hooks excluded, such a shortcode fails
  # the build and such a code block renders as plain code; neither links a file
  # the site does not publish.
  [[module.imports]]
    path = "github.com/flink-gcp/flink-gcp-dev-tools/hugo"
    ignoreImports = true
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
      files = [
        "! /_markup/render-codeblock-katex.html",
        "! /_markup/render-codeblock-mermaid.html",
        "! /_shortcodes/asciinema.html",
        "! /_shortcodes/katex.html",
        "! /_shortcodes/mermaid.html",
      ]
    [[module.imports.mounts]]
      source = "i18n"
      target = "i18n"
    [[module.imports.mounts]]
      # favicon.svg is the web app manifest's icon.
      source = "static"
      target = "static"
      files = ["/favicon.png", "/favicon.svg", "/fuse.min.mjs"]

[params]
  # The shared module supplies BookTheme = "auto"; other Hugo Book defaults remain unset.
  BookRepo = "https://github.com/flink-gcp/flink-datastream-protobuf"
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/docs/{{ .Path }}'
