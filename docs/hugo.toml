baseURL = "https://flink-gcp.github.io/flink-datastream-protobuf/"
locale = "en-us"
title = "Protobuf for Apache Flink DataStream"
disableKinds = ["taxonomy", "term"]

[markup.highlight]
  noClasses = false

[module]
  [[module.imports]]
    path = "github.com/flink-gcp/flink-gcp-dev-tools/hugo"
    ignoreImports = true
  # Keep the shared design first, but publish only the theme assets used here.
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "i18n"
      target = "i18n"
    [[module.imports.mounts]]
      source = "static"
      target = "static"
      files = ["/favicon.svg", "/favicon.png", "/fuse.min.mjs"]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "."
    target = "content/docs"
    files = ["/*.md", "/adr/**.md", "/validation/**.md"]
  [[module.mounts]]
    source = "../target/apidocs"
    target = "static/api/java"

  [[module.mounts]]
    source = "../LICENSE"
    target = "static/licenses/apache-2.0.txt"
  [[module.mounts]]
    source = "../examples/datastream/src/main/java/io/github/flink/gcp/protobuf/examples"
    target = "assets/examples/java"
    files = ["/*.java"]
  [[module.mounts]]
    source = "../examples/datastream/config"
    target = "assets/examples/config"
    files = ["/config.yaml"]

[params]
  BookRepo = "https://github.com/flink-gcp/flink-datastream-protobuf"
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/docs/{{ .Path }}'
  SourceCommit = "main"
  DocsVersion = "Development"
