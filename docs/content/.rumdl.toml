# The site pages use the repository configuration, except for MD052 shortcut references.
# A link to a Hugo shortcode destination, such as `[text]({{< relref "page" >}})`, is not a
# CommonMark inline link, so its text would be reported as an undefined shortcut reference.
# rumdl has no per-file rule options; it applies the nearest configuration to each file, but
# not with `--config`, so run it as `just lint` does.
extends = "../../.rumdl.toml"

[MD052]
shortcut-syntax = false
