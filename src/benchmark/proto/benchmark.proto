syntax = "proto3";
package benchmark;
option java_package = "io.github.flink.gcp.protobuf.benchmark.generated";
option java_outer_classname = "BenchmarkProtos";
message Child { int32 code = 1; string name = 2; }
message Record {
  int32 id = 1;
  int64 timestamp = 2;
  bool active = 3;
  string name = 4;
  optional string note = 5;
  bytes payload = 6;
  Child child = 7;
  repeated int64 values = 8;
  map<string, int64> attributes = 9;
}
