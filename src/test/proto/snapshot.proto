syntax = "proto3";
package flink.protobuf.snapshot;
option java_package = "io.github.flink.gcp.protobuf.snapshotgenerated";
option java_outer_classname = "SnapshotMessages";
import "snapshot_dependency.proto";
message Envelope {
  int32 id = 1;
  Detail detail = 2;
  Envelope child = 3;
  enum Kind { UNKNOWN = 0; READY = 1; }
  Kind kind = 4;
  message Nested { string text = 1; }
  Nested nested = 5;
}
