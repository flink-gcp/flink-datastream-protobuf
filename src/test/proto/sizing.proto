syntax = "proto3";
package flink.protobuf.serializer;
option java_package = "io.github.flink.gcp.protobuf.generated";
option java_multiple_files = true;

import "serializer.proto";

// An acyclic graph of height 3: a map value under a branch is the deepest message.
message BoundedLeaf {
  int32 code = 1;
  string name = 2;
  bytes data = 3;
  repeated sint64 values = 4;
  repeated bytes chunks = 5;
}
message BoundedBranch {
  BoundedLeaf leaf = 1;
  repeated BoundedLeaf leaves = 2;
  map<string, BoundedLeaf> named = 3;
  map<int32, string> labels = 4;
}
message BoundedMessage {
  int64 id = 1;
  string text = 2;
  optional string note = 3;
  bytes payload = 4;
  repeated int64 packed = 5;
  repeated string strings = 6;
  BoundedLeaf leaf = 7;
  BoundedBranch branch = 8;
  repeated BoundedBranch branches = 9;
  map<string, int64> counts = 10;
  oneof choice { BoundedLeaf selected = 11; string selected_text = 12; }
  repeated bytes chunks = 13;
}
// Not recursive itself, but its graph reaches a recursive type.
message ReachesRecursive {
  RecursiveMessage node = 1;
}
