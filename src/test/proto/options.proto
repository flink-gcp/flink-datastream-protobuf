syntax = "proto2";
package flink.protobuf.serializer;
option java_package = "io.github.flink.gcp.protobuf.generated";
option java_multiple_files = true;
import "google/protobuf/descriptor.proto";
extend google.protobuf.MessageOptions { optional string marker = 50000; }
message OptionMessage {
  option (marker) = "retained metadata";
  optional string value = 1;
}
