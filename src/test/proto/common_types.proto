syntax = "proto3";
package flink.protobuf.common;
option java_package = "io.github.flink.gcp.protobuf.generated";
option java_multiple_files = true;

import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/wrappers.proto";
import "opentelemetry/proto/common/v1/common.proto";

message CommonTypesEnvelope {
  int32 ordinal = 1;
  google.protobuf.Struct struct_value = 2;
  google.protobuf.Value value = 3;
  google.protobuf.ListValue list = 4;
  google.protobuf.Any any = 5;
  google.protobuf.Timestamp timestamp = 6;
  google.protobuf.Duration duration = 7;
  google.protobuf.Empty empty = 8;
  google.protobuf.FieldMask mask = 9;
  google.protobuf.DoubleValue double_wrapper = 10;
  google.protobuf.FloatValue float_wrapper = 11;
  google.protobuf.Int64Value int64_wrapper = 12;
  google.protobuf.UInt64Value uint64_wrapper = 13;
  google.protobuf.Int32Value int32_wrapper = 14;
  google.protobuf.UInt32Value uint32_wrapper = 15;
  google.protobuf.BoolValue bool_wrapper = 16;
  google.protobuf.StringValue string_wrapper = 17;
  google.protobuf.BytesValue bytes_wrapper = 18;
  opentelemetry.proto.common.v1.AnyValue otel_value = 19;
  opentelemetry.proto.common.v1.ArrayValue otel_array = 20;
  opentelemetry.proto.common.v1.KeyValueList otel_list = 21;
  opentelemetry.proto.common.v1.KeyValue otel_entry = 22;
}
